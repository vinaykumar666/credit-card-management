name: CI-CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      skip_sonar:
        description: "Skip SonarQube stage"
        type: boolean
        default: false
      skip_nexus_iq:
        description: "Skip Nexus IQ stage"
        type: boolean
        default: false
      skip_deploy:
        description: "Skip EC2 deployment"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/credit-card

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven compile
        run: mvn -B -DskipTests compile

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven verify (tests + JaCoCo)
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: "**/target/site/jacoco/**"
          if-no-files-found: ignore

  sonar:
    name: SonarQube
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' && secrets.SONAR_TOKEN != '' || (github.event_name == 'workflow_dispatch' && !inputs.skip_sonar && secrets.SONAR_TOKEN != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Sonar scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.qualitygate.wait=true

  nexus-iq:
    name: Nexus IQ
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' && secrets.NEXUS_IQ_URL != '' || (github.event_name == 'workflow_dispatch' && !inputs.skip_nexus_iq && secrets.NEXUS_IQ_URL != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Nexus IQ evaluate
        env:
          NEXUS_IQ_URL: ${{ secrets.NEXUS_IQ_URL }}
          NEXUS_IQ_USER: ${{ secrets.NEXUS_IQ_USER }}
          NEXUS_IQ_PASSWORD: ${{ secrets.NEXUS_IQ_PASSWORD }}
        run: |
          mvn -B package -DskipTests \
            com.sonatype.clm:nexus-iq-maven-plugin:evaluate \
            -Dnexus-iq.serverUrl=${NEXUS_IQ_URL} \
            -Dnexus-iq.username=${NEXUS_IQ_USER} \
            -Dnexus-iq.password=${NEXUS_IQ_PASSWORD} \
            -Dnexus-iq.applicationId=credit-card-platform \
            -Dnexus-iq.stage=build

  docker-and-publish:
    name: Docker image and Publish
    needs: [test, sonar, nexus-iq]
    if: |
      always() &&
      needs.test.result == 'success' &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') &&
      (needs.nexus-iq.result == 'success' || needs.nexus-iq.result == 'skipped') &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        run: |
          set -euo pipefail
          TAG=${{ steps.meta.outputs.sha }}
          build_push() {
            local dockerfile=$1
            local context=$2
            local name=$3
            docker build -f "$dockerfile" \
              -t "${IMAGE_PREFIX}-${name}:${TAG}" \
              -t "${IMAGE_PREFIX}-${name}:latest" \
              "$context"
            docker push "${IMAGE_PREFIX}-${name}:${TAG}"
            docker push "${IMAGE_PREFIX}-${name}:latest"
          }
          build_push cards-authentication-service/Dockerfile . cards-authentication-service
          build_push cards-account-details-service/Dockerfile . cards-account-details-service
          build_push cards-payment-service/Dockerfile . cards-payment-service
          build_push cards-notification-service/Dockerfile . cards-notification-service
          build_push cards-enterprise-api-service/Dockerfile . cards-enterprise-api-service
          build_push cards-api-gateway-service/Dockerfile . cards-api-gateway-service
          build_push cards-bff-dashboard-service/Dockerfile . cards-bff-dashboard-service
          build_push cards-dashboard-ui/Dockerfile cards-dashboard-ui cards-dashboard-ui

  deploy:
    name: Deployment
    needs: docker-and-publish
    if: |
      always() &&
      needs.docker-and-publish.result == 'success' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      (github.event_name != 'workflow_dispatch' || !inputs.skip_deploy) &&
      secrets.EC2_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy deploy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/ec2/*"
          target: "/opt/credit-card-platform"
          strip_components: 2
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,OWNER
          script: |
            set -euo pipefail
            cd /opt/credit-card-platform
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_PREFIX="ghcr.io/${OWNER}/credit-card"
            export IMAGE_TAG=latest
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
