<div class="shell">
  <aside class="rail">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <p class="brand-name">AURUM</p>
        <p class="brand-tag">My cards</p>
      </div>
    </div>

    <nav class="nav" aria-label="Main menu">
      <a routerLink="/dashboard" routerLinkActive="active">
        <span class="nav-ico" aria-hidden="true">⌂</span>
        Home
      </a>
      <a routerLink="/accounts" routerLinkActive="active">
        <span class="nav-ico" aria-hidden="true">▣</span>
        My cards
      </a>
      <a routerLink="/payments" routerLinkActive="active">
        <span class="nav-ico" aria-hidden="true">↗</span>
        Send &amp; pay
      </a>
      <a routerLink="/beneficiaries" routerLinkActive="active">
        <span class="nav-ico" aria-hidden="true">◇</span>
        Payees
      </a>
      <a routerLink="/notifications" routerLinkActive="active">
        <span class="nav-ico" aria-hidden="true">⌁</span>
        Messages
      </a>
    </nav>

    <div class="rail-foot">
      <p class="user-label">Signed in as</p>
      <p class="user-email">{{ email }}</p>
      <button type="button" class="ghost-btn" (click)="logout()">Sign out</button>
    </div>
  </aside>

  <main class="content">
    <div class="content-glow" aria-hidden="true"></div>
    <router-outlet />
  </main>
</div>
