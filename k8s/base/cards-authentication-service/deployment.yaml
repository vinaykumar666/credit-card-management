apiVersion: apps/v1
kind: Deployment
metadata:
  name: cards-authentication-service
  labels:
    app: cards-authentication-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cards-authentication-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cards-authentication-service
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: cards-authentication-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: cards-authentication-service
          image: cards-authentication-service:1.0.0
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: cards-authentication-service
            - secretRef:
                name: cards-authentication-service
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
