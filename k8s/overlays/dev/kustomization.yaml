apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: cards-authentication-service
    newTag: dev
  - name: cards-account-details-service
    newTag: dev
  - name: cards-payment-service
    newTag: dev
  - name: cards-notification-service
    newTag: dev
  - name: cards-enterprise-api-service
    newTag: dev
  - name: cards-api-gateway-service
    newTag: dev
replicas:
  - name: cards-authentication-service
    count: 1
  - name: cards-account-details-service
    count: 1
  - name: cards-payment-service
    count: 1
  - name: cards-notification-service
    count: 1
  - name: cards-enterprise-api-service
    count: 1
  - name: cards-api-gateway-service
    count: 1
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: cards-authentication-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: cards-account-details-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: cards-payment-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: cards-notification-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: cards-enterprise-api-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: cards-api-gateway-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: PodDisruptionBudget
      name: cards-payment-service
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 1
  - target:
      kind: PodDisruptionBudget
      name: cards-api-gateway-service
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 1
