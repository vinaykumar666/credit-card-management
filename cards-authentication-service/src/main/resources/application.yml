server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: cards-authentication-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:cards}
    password: ${DB_PASSWORD:cards}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      authorizationserver:
        issuer: ${OAUTH2_ISSUER:http://localhost:8081}
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  oauth2:
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    clients:
      - client-id: cards-dashboard-ui
        client-secret: ${OAUTH2_UI_SECRET:{noop}dashboard-secret}
        redirect-uris:
          - http://localhost:4200/callback
          - http://localhost:8088/callback
        grant-types:
          - authorization_code
          - refresh_token
        scopes:
          - openid
          - profile
          - cards.read
          - cards.write
        require-pkce: true
      - client-id: cards-bff-service
        client-secret: ${OAUTH2_BFF_SECRET:{noop}bff-secret}
        grant-types:
          - client_credentials
          - refresh_token
        scopes:
          - cards.read
          - cards.write
        require-pkce: false
  channels:
    allowed:
      - WEB
      - MOBILE
      - BRANCH
  clients-allowed:
    - cards-dashboard-ui
    - cards-mobile
    - cards-branch-portal

logging:
  level:
    root: INFO
    com.cards: INFO
    org.springframework.security: INFO
