services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cards
      POSTGRES_PASSWORD: cards
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cards"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # In-compose clients use kafka:9092; host apps can use docker host networking or run via compose
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  cards-authentication-service:
    build:
      context: .
      dockerfile: cards-authentication-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: cards
      DB_PASSWORD: cards
      JWT_SECRET: change-me-to-a-very-long-secret-key-at-least-256-bits-long!!
      OAUTH2_ISSUER: http://cards-authentication-service:8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  cards-account-details-service:
    build:
      context: .
      dockerfile: cards-account-details-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/account_db
      DB_USERNAME: cards
      DB_PASSWORD: cards
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  cards-payment-service:
    build:
      context: .
      dockerfile: cards-payment-service/Dockerfile
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: cards
      DB_PASSWORD: cards
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ENTERPRISE_API_URL: http://cards-enterprise-api-service:8085
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cards-enterprise-api-service:
        condition: service_started

  cards-notification-service:
    build:
      context: .
      dockerfile: cards-notification-service/Dockerfile
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: cards
      DB_PASSWORD: cards
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  cards-enterprise-api-service:
    build:
      context: .
      dockerfile: cards-enterprise-api-service/Dockerfile
    environment:
      SERVER_PORT: 8085
    ports:
      - "8085:8085"

  # Preferred UI path: browser/app → BFF:8086 → gateway:8080 → services.
  # Gateway also routes /bff/** for optional edge consistency.
  cards-bff-dashboard-service:
    build:
      context: .
      dockerfile: cards-bff-dashboard-service/Dockerfile
    environment:
      SERVER_PORT: 8086
      OAUTH2_ISSUER: http://cards-authentication-service:8081
      GATEWAY_BASE_URL: http://cards-api-gateway-service:8080
    ports:
      - "8086:8086"
    depends_on:
      - cards-api-gateway-service
      - cards-authentication-service

  cards-api-gateway-service:
    build:
      context: .
      dockerfile: cards-api-gateway-service/Dockerfile
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://cards-authentication-service:8081
      ACCOUNT_SERVICE_URL: http://cards-account-details-service:8082
      PAYMENT_SERVICE_URL: http://cards-payment-service:8083
      NOTIFICATION_SERVICE_URL: http://cards-notification-service:8084
      ENTERPRISE_SERVICE_URL: http://cards-enterprise-api-service:8085
      BFF_SERVICE_URL: http://cards-bff-dashboard-service:8086
    ports:
      - "8080:8080"
    depends_on:
      - cards-authentication-service
      - cards-account-details-service
      - cards-payment-service
      - cards-notification-service
      - cards-enterprise-api-service

  cards-dashboard-ui:
    build:
      context: ./cards-dashboard-ui
      dockerfile: Dockerfile
    ports:
      - "8088:80"
    depends_on:
      - cards-bff-dashboard-service
      - cards-authentication-service

volumes:
  postgres_data:
